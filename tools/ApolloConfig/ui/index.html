<!doctype html>
<html lang="pt-BR" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>R3D PLAY</title>
<link rel="icon" type="image/svg+xml" href="r3d-logo.svg">
<link rel="stylesheet" href="style.css">
<link rel="stylesheet" href="css/components.css">
<link rel="stylesheet" href="css/home.css">
<link rel="stylesheet" href="css/games.css">
<link rel="stylesheet" href="css/devices.css">
<link rel="stylesheet" href="css/settings.css">
<link rel="stylesheet" href="css/system.css">
</head>
<body>
<div id="app" class="app" hidden>
  <header class="topbar">
    <div class="brand">
      <img class="logo" src="r3d-logo.svg" alt="" aria-hidden="true">
      <div><span>Game streaming</span><strong>R3D PLAY</strong></div>
    </div>
    <nav class="tabs" id="tabs" aria-label="Navegação"></nav>
    <div class="status-line"><span id="statusDot" class="dot"></span><span id="statusText">Verificando…</span></div>
  </header>
  <div class="topline"></div>
  <div class="banner bad" id="banner" role="status" hidden></div>

  <main class="main">
    <div class="content">
      <h1 class="page-title" id="pageTitle">Início</h1>
      <div id="views"></div>
    </div>
  </main>
</div>

<div id="auth" class="auth" hidden>
  <form class="card auth-card" id="authForm">
    <img class="logo-big" src="r3d-logo.svg" alt="R3D PLAY">
    <h2 id="authTitle">Entrar</h2>
    <p class="muted" id="authSub">Use o usuário e a senha do seu R3D PLAY. Só precisa digitar uma vez.</p>
    <label>Usuário<input id="authUser" autocomplete="username" required></label>
    <label>Senha<input id="authPass" type="password" autocomplete="current-password" required></label>
    <label id="authPass2Wrap" hidden>Repita a senha<input id="authPass2" type="password" autocomplete="new-password"></label>
    <p class="error" id="authErr" hidden></p>
    <button class="btn primary wide" type="submit" id="authBtn">Entrar</button>
  </form>
</div>

<div id="toasts" class="toasts" popover="manual" aria-live="polite"></div>
<dialog id="dlg"><form method="dialog"><h3 id="dlgTitle" hidden></h3><p id="dlgMsg"></p><div class="row-actions"><button class="btn" value="no" id="dlgNo">Cancelar</button><button class="btn danger" value="yes" id="dlgYes">Confirmar</button></div></form></dialog>
<script type="module" src="js/main.js"></script>
</body>
</html>
